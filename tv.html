<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmanTrade · TV Cast</title>
  <link rel="stylesheet" href="styles.css?v=8" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e14; color: #e8ecf3; font-family: system-ui, sans-serif; }
    #tv-head { padding: 14px 22px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #1b2030; background: #10141d; }
    #tv-head .brand { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
    #tv-head .brand b { color: #f0b90b; }
    #tv-head .hint { font-size: 12px; color: #5c6373; margin-left: auto; }
    #tv-grid { flex: 1; display: grid; gap: 8px; padding: 10px; min-height: 0; }
    .tv-tile { background: #0f131c; border: 1px solid #1b2030; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
    .tv-tile .tv-head { padding: 8px 12px; font-size: 16px; font-weight: 700; font-family: monospace; border-bottom: 1px solid #1b2030; display: flex; justify-content: space-between; }
    .tv-tile .tv-price { font-family: monospace; }
    .tv-tile canvas { flex: 1; width: 100%; display: block; }
    #tv-wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #5c6373; }
  </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;">
  <div id="tv-head">
    <span class="brand">Oman<b>Trade</b></span>
    <span class="hint">Live trading view · cast from your browser (Chromecast / AirPlay) or HDMI</span>
  </div>
  <div id="tv-grid"></div>
  <div id="tv-wait">Waiting for OmanTrade session… open the dashboard and click “Cast to TV”.</div>
  <script src="tv.js?v=8"></script>
</body>
</html>
